<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Входящие заявки</title>
  <style>
    body { max-width: 40rem; margin: 2rem auto; padding: 0 1rem; font: 1rem/1.5 system-ui, sans-serif; }
    textarea { box-sizing: border-box; display: block; width: 100%; margin: .5rem 0; padding: .5rem; font: inherit; }
    button { padding: .4rem .8rem; font: inherit; }
    #result { white-space: pre-wrap; overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <h1>Входящие заявки</h1>
  <form>
    <label for="message">Текст заявки</label>
    <textarea id="message" rows="4"></textarea>
    <button type="submit">Разобрать заявку</button>
  </form>
  <p id="result" role="status"></p>
  <script type="module">
    const form = document.querySelector("form");
    const message = document.querySelector("#message");
    const result = document.querySelector("#result");
    const topics = { delivery: "Доставка", pricing: "Стоимость", other: "Другое" };
    let latestRequest = 0;

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const requestId = ++latestRequest;
      result.textContent = "Разбираем заявку…";

      let feedback = "Не удалось разобрать заявку. Повторите попытку.";
      try {
        const reply = await fetch("/api/triage", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text: message.value }),
        });
        const triage = await reply.json();

        if (reply.ok && triage.status === "ready") {
          feedback = `Тема: ${topics[triage.topic]}\n\nЧерновик ответа:\n${triage.draft}`;
        } else if (reply.ok && triage.status === "manual_review") {
          feedback = "Заявка требует ручной обработки. Выберите тему и подготовьте ответ самостоятельно.";
        } else if (reply.status === 400 && triage.status === "invalid_input") {
          feedback = "Введите текст заявки.";
        }
      } catch {
        // Keep the fallback message for network failures and invalid responses.
      }

      if (requestId === latestRequest) result.textContent = feedback;
    });
  </script>
</body>
</html>
